name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true
        default: '26.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install server dependencies
        run: npm install --prefix server
      
      - name: Build Client (Windows)
        run: npm run build:client:setup
      
      - name: Build Server (Windows)
        run: node scripts/build-server-win.js
      
      - name: Upload Client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: dist/client/*.exe
      
      - name: Upload Server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-server
          path: dist/server-win/

  build-linux:
    name: Build Linux Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Server (Linux)
        run: node scripts/build-server-linux.js
      
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: dist/SN1-Server.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v${{ steps.get_version.outputs.VERSION }} \
            --title "SpeakNex ${{ steps.get_version.outputs.VERSION }}" \
            --generate-notes \
            windows-client/*.exe \
            linux-server/SN1-Server.tar.gz
